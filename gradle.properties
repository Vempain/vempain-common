# Team code convention, adoption ratchet: Spotless only formats and checks files that differ from this ref, so the
# codebase converges one pull request at a time. Remove after the whole-codebase reformat
# (./gradlew -Pconvention.ratchetFrom=NONE spotlessApply); see java-style-baseline/README.md.
convention.ratchetFrom=origin/main
# Configuration cache: the configured task graph is stored and reused by the next build with the same inputs
# (https://docs.gradle.org/current/userguide/configuration_cache.html); the build scripts must stay compatible with it.
org.gradle.configuration-cache=true
